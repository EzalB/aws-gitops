name: CI / GitOps Pipeline Configurator

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app-release.yml'

concurrency:
  group: gitops-release
  cancel-in-progress: false

permissions: read-all

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
  HELM_VALUES_FILE: "helm/nginx-app/values.yaml"

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GHA_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Image Tag
        id: image_tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          cd app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image_tag.outputs.tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          # The native credentials action automatically masks accounts, but we add 
          # explicit masks to ensure logs never dump the dynamically constructed URI.
          echo "::add-mask::$ECR_REGISTRY"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  update-helm-manifest:
    needs: build-scan-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and Update Helm values.yaml
        env:
          NEW_TAG: ${{ needs.build-scan-and-push.outputs.image_tag }}
        run: |
          # Use sed without dumping diff logs to obscure the registry layout in GitHub UI
          sed -i "s/tag: .*/tag: \"${NEW_TAG}\"/g" ${{ env.HELM_VALUES_FILE }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitOps Release Bot"
          git config --global user.email "actions@github.com"
          git add ${{ env.HELM_VALUES_FILE }}
          
          # We check if there are actual changes to prevent failure errors
          if ! git diff-index --quiet HEAD; then
            git commit -m "ci: update image tag to ${{ needs.build-scan-and-push.outputs.image_tag }} [skip ci]"
            git push origin main
          else
            echo "No changes in manifest found."
          fi
